<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>X GYM — صفحة العضو</title>
<meta name="theme-color" content="#0B1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X GYM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="login-screen">
  <!-- غيّر اسم الملف هنا لصورة الخلفية اللي هتضيفها -->
  <img class="onb-bg-img" src="img1.jpeg" alt="">
  <div class="onb-overlay"></div>

  <div class="onb-top">
    <div class="onb-logo"><span class="onb-logo-x">X</span><span class="onb-logo-gym">GYM</span></div>
    <div class="onb-tagline">STRONGER EVERYDAY</div>
  </div>

  <div class="onb-sheet">
    <div class="onb-sheet-handle"></div>
    <div class="login-heading">صفحة العضو</div>
    <div class="login-card">
      <div class="login-error" id="login-error"></div>
      <div class="field-icon">
        <div class="field-inputs">
          <label>رقم العضوية (Member ID)</label>
          <input type="text" id="login-id" placeholder="مثال: XG-0001" dir="ltr" style="text-align:left">
        </div>
        <div class="field-icon-el"><i class="fas fa-id-card"></i></div>
      </div>
      <div class="field-icon">
        <div class="field-inputs">
          <label>رقم الموبايل المسجل</label>
          <input type="tel" id="login-pin" placeholder="01xxxxxxxxx" inputmode="numeric" dir="ltr" style="text-align:left;letter-spacing:1px">
        </div>
        <div class="field-icon-el"><i class="fas fa-mobile-screen"></i></div>
      </div>
      <button class="btn btn-gold" id="login-btn"><i class="fas fa-right-to-bracket"></i> تسجيل الدخول</button>
      <button class="btn btn-install" id="install-btn" type="button" style="display:none"><i class="fas fa-download"></i> تحميل التطبيق على موبايلك</button>
      <div class="login-hint">استخدم رقم العضوية ورقم الموبايل المسجّل عندنا للدخول</div>
    </div>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">X GYM</div>
    <div class="topbar-actions">
      <div class="notif-wrap">
        <button class="icon-btn" id="notif-btn" onclick="toggleNotifications()"><i class="fas fa-bell"></i><span class="notif-dot" id="notif-dot"></span></button>
        <div class="notif-panel" id="notif-panel">
          <div class="notif-panel-head">الإشعارات</div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
      <button class="icon-btn" onclick="logout()"><i class="fas fa-arrow-right-from-bracket"></i></button>
    </div>
  </div>

  <!-- الرئيسية -->
  <div class="tab-panel active" id="home-panel"></div>

  <!-- الحضور -->
  <div class="tab-panel" id="attendance-panel-wrap">
    <div class="att-page-header">
      <div class="att-cal-badge"><i class="fas fa-calendar-days"></i></div>
      <div class="att-page-title">سجل الحضور</div>
      <button class="att-back-btn" onclick="switchToMain('home')"><i class="fas fa-chevron-left"></i></button>
    </div>
    <div class="att-summary-card">
      <div class="att-summary-col">
        <div class="att-summary-val" id="att-total-val">0</div>
        <div class="att-summary-label">إجمالي مرات الحضور</div>
      </div>
      <div class="att-summary-divider"></div>
      <div class="att-summary-col">
        <div class="att-summary-val" id="att-month-val">0</div>
        <div class="att-summary-label">هذا الشهر</div>
      </div>
    </div>
    <div class="att-list-heading">سجل الحضور</div>
    <div id="attendance-panel"></div>
  </div>

  <!-- أنظمة التدريب -->
  <div class="tab-panel" id="training-panel-wrap">
    <div class="att-page-header">
      <div class="att-cal-badge"><i class="fas fa-dumbbell"></i></div>
      <div class="att-page-title" id="training-title">أنظمة التدريب</div>
      <button class="att-back-btn" onclick="trainingBack()"><i class="fas fa-chevron-left"></i></button>
    </div>
    <div id="training-panel"></div>
  </div>

  <!-- الباركود -->
  <div class="tab-panel" id="barcode-panel-wrap">
    <div class="pass-card">
      <div class="pass-header">
        <div class="pass-logo"><span class="pass-logo-x">X</span><span class="pass-logo-gym">GYM</span></div>
        <div class="pass-tagline">MEMBERSHIP PASS</div>
      </div>
      <div class="pass-photo-wrap" id="pass-photo-wrap"></div>
      <div class="pass-name" id="pass-name"></div>
      <div class="pass-id" id="pass-id"></div>

      <div class="pass-barcode-card">
        <svg id="member-barcode-svg" style="max-width:100%"></svg>
      </div>

      <div class="pass-status-row" id="pass-status-row"></div>

      <div class="pass-expiry">
        <div class="pass-expiry-label"><i class="fas fa-calendar-days"></i>تاريخ الانتهاء</div>
        <div class="pass-expiry-val" id="pass-expiry-val"></div>
      </div>
    </div>

    <button class="btn btn-gold pass-show-btn" onclick="showFullBarcode()"><i class="fas fa-qrcode"></i> إظهار الكود</button>

    <div class="barcode-actions">
      <button class="btn btn-outline" onclick="downloadBarcode()"><i class="fas fa-download"></i> تحميل</button>
      <button class="btn btn-outline" onclick="printBarcode()"><i class="fas fa-print"></i> طباعة</button>
    </div>
  </div>

  <!-- شاشة الباركود المكبّر -->
  <div class="barcode-modal" id="barcode-modal">
    <div class="barcode-modal-inner">
      <div class="gym-name">X GYM</div>
      <div id="bc-modal-sub" class="member-line"></div>
      <svg id="member-barcode-svg-modal" style="max-width:100%"></svg>
      <button class="btn btn-outline" onclick="closeFullBarcode()"><i class="fas fa-xmark"></i> إغلاق</button>
    </div>
  </div>

  <!-- مشغّل الفيديو -->
  <div class="video-modal" id="video-modal" onclick="if(event.target===this)closeTrainingVideo()">
    <div class="video-modal-inner">
      <button class="video-close" onclick="closeTrainingVideo()"><i class="fas fa-xmark"></i></button>
      <div class="video-frame" id="video-frame"></div>
      <div class="video-meta">
        <div class="video-meta-title" id="video-meta-title"></div>
        <div class="video-meta-note" id="video-meta-note"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== شريط التنقل السفلي ===== -->
<div class="bottom-nav" id="bottom-nav" style="display:none">
  <button class="nav-btn active" id="nav-home" onclick="switchToMain('home')"><i class="fas fa-house"></i>الرئيسية</button>
  <button class="nav-btn" id="nav-attendance" onclick="switchToMain('attendance')"><i class="fas fa-calendar-check"></i>الحضور</button>
  <button class="nav-btn" id="nav-training" onclick="switchToMain('training')"><i class="fas fa-dumbbell"></i>التدريب</button>
  <button class="nav-btn" id="nav-barcode" onclick="switchToMain('barcode')"><i class="fas fa-barcode"></i>الباركود</button>
</div>

<!-- ===== شرح تثبيت التطبيق (iPhone / متصفحات بدون تثبيت مباشر) ===== -->
<div class="install-modal" id="install-modal">
  <div class="install-modal-inner">
    <div class="install-modal-title"><i class="fas fa-mobile-screen-button"></i> تثبيت X GYM كتطبيق</div>
    <ol class="install-steps" id="install-steps"></ol>
    <button class="btn btn-gold" type="button" onclick="closeInstallModal()">تمام</button>
  </div>
</div>

<div id="toast"></div>

<script src="training-data.js"></script>
<script src="script.js"></script>
<script>
// إظهار شريط التنقل بعد الدخول + دعم التبويبات الثلاثة (الرئيسية/الحضور/الباركود)
const _origLoad = loadMemberData;
loadMemberData = async function(){
  // الشريط يظهر فورًا بمجرد دخول التطبيق، حتى لو حصل خطأ في عرض جزء من البيانات
  document.getElementById('bottom-nav').style.display = 'flex';
  try{ await _origLoad(); }
  catch(e){ console.error('loadMemberData error:', e); }
};
function switchToMain(tab){
  document.querySelectorAll('#app > .tab-panel').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById(tab==='home' ? 'home-panel' : tab+'-panel-wrap').classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
}
</script>
</body>
</html>
